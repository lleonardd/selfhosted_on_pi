services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    depends_on:
      - matter-server
      - otbr
    volumes:
      - /mnt/raid1/homeassistant:/config # Config on RAID1
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro # enables D-Bus access if needed
    environment:
      - TZ=Europe/Berlin # set your timezone
    restart: unless-stopped
    privileged: true
    network_mode: host

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    network_mode: host
    environment:
      - MATTER_SERVER_PORT=5580
    volumes:
      - /mnt/raid1/matter:/data     # Persistenz auf RAID
    restart: unless-stopped

  otbr:
    image: openthread/border-router:stable # NOT :latest — that tracks the main dev branch; NOT openthread/otbr — CI test image
    container_name: otbr
    network_mode: host
    privileged: true
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_a21bfd3fddc2ef11879bedb08048b910-if00-port0:/dev/ttyUSB0 # Sonoff Zigbee 3.0 USB Dongle Plus V2
      - /dev/net/tun:/dev/net/tun # REQUIRED for virtual network interface
    volumes:
      - /mnt/raid1/otbr:/data/thread # Persistenz auf RAID — NICHT /var/lib/thread, das legt das Image selbst als Symlink an
    environment:
      - OT_RCP_DEVICE=spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=460800 # ohne uart-flow-control, Firmware ist ein no-flow Build
      - OT_INFRA_IF=eth0               # sonst wlan0
      - OT_LOG_LEVEL=5                 # sonst 7, das flutet das Log
    restart: unless-stopped
